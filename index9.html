<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Listado de Documentos 3</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
</head>
<body>
<div class="container">
<h2>Listado de Documentos Tributarios</h2>

<!-- Barra de contraseña para descifrar TXT -->
<div id="pwdBar" style="margin-bottom:10px;display:flex;gap:8px;align-items:center;">
  <label style="font-size:13px;font-weight:600;">Contraseña:</label>
  <input type="password" id="pwdInput" placeholder="Clave de descifrado" style="padding:5px 10px;font-size:13px;border:1px solid #ccc;border-radius:4px;width:200px;">
  <button onclick="setPwd()" style="padding:5px 14px;font-size:13px;">OK</button>
  <span id="pwdStatus" style="font-size:12px;color:green;"></span>
</div>

<div class="filters">
<input type="text" id="fTipo" placeholder="TipoDoc">
<input type="text" id="fRut" placeholder="RUT">
<input type="text" id="fRazon" placeholder="Razón Social">
<input type="text" id="fFolio" placeholder="Folio">
<label>Fecha:</label>
<input type="date" id="fFecha">
<select id="fPdf">
<option value="">HTML: Todos</option>
<option value="con">Con HTML</option>
<option value="sin">Sin HTML</option>
</select>
<button onclick="applyFilters()">Aplicar</button>
<button onclick="resetFilters()">Limpiar</button>
</div>
<table>
<thead>
<tr>
<th>Ok</th>
<th>Nro</th>
<th>Td</th>
<th>RUT</th>
<th>RazonSocial</th>
<th>Folio</th>
<th>Fecha</th>
<th class="money"><b>Exento</b></th>
<th class="money"><b>Neto</b></th>
<th class="money"><b>IVA</b></th>
<th class="money"><b>Total</b></th>
<th>Cuenta Contable</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>
<div id="paginacion" style="margin-top:15px;text-align:center;"></div>
</div>

<!-- MODAL ERP -->
<div id="accountModal" class="modal">
<div class="modal-content">
<div class="modal-grid">
<div class="asiento-panel">
<div><b>ASIENTO CONTABLE</b></div>
<div><b>Proveedor:</b> <span id="mProveedor"></span></div>
<div><b>RUT:</b> <span id="mRut"></span></div>
<div><b>Folio:</b> <span id="mFolio"></span></div>
<div><b>Fecha:</b> <span id="mFecha"></span></div>
<br>
<label>Glosa</label>
<input type="text" id="mGlosa" style="width:100%">
<br><br>
<table class="asiento">
<thead>
<tr>
<th>Cuenta</th><th>Debe</th><th>Haber</th><th></th>
</tr>
</thead>
<tbody id="asientoBody"></tbody>
</table>
<br>
<button onclick="addRow()">+ Agregar Cuenta</button>
<br><br>
<div style="text-align:right">
<b>Total Debe:</b> <span id="totalDebe"></span><br>
<b>Total Haber:</b> <span id="totalHaber"></span>
</div>
<br>
<button onclick="saveAccount()">Guardar</button>
<button onclick="closeModal()">Cerrar</button>
<button onclick="downloadCSV()">Descargar CSV</button>
</div>
<div class="resizer"></div>
<div class="factura">
  <div id="frameStatus" style="padding:12px;font-size:13px;color:#666;display:none;"></div>
  <iframe id="docFrame"></iframe>
</div>
</div>
<datalist id="cuentasDatalist"></datalist>
</div>
</div>

<script>
// ─── CONFIGURACIÓN ────────────────────────────────────────────────────────────
// URL base de tu repositorio GitHub Pages
const BASE_URL = './';
// Nombre del CSV principal de facturas
const CSV_FILE = 'Tmp.csv';
// Nombre del CSV de plan de cuentas
const PLAN_FILE = 'plan_cuentas.csv';
// ─────────────────────────────────────────────────────────────────────────────

const tbody      = document.getElementById("tbody");
const paginacion = document.getElementById("paginacion");
const PAGE_SIZE  = 10;

let allRows      = [];
let filteredRows = [];
let planCuentas  = [];
let currentPage  = 1;
let statusMap    = {};
let accountMap   = {};
let currentId    = null;
let userPassword = '';
let currentBlobUrl = null;

// ─── CONTRASEÑA ───────────────────────────────────────────────────────────────
function setPwd() {
  const v = document.getElementById('pwdInput').value.trim();
  if (!v) return;
  userPassword = v;
  const s = document.getElementById('pwdStatus');
  s.textContent = '✓ Contraseña establecida';
  s.style.color = 'green';
  setTimeout(() => s.textContent = '', 3000);
}
document.getElementById('pwdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') setPwd();
});

// ─── CARGA INICIAL DESDE GITHUB ───────────────────────────────────────────────
async function init() {
  // Cargar plan de cuentas (opcional, no falla si no existe)
  try {
    const r = await fetch(BASE_URL + PLAN_FILE);
    if (r.ok) {
      const txt = await r.text();
      planCuentas = txt.split(/\r?\n/).filter(l => l.trim()).map(l => l.split(";")[0].trim());
      actualizarDatalistCuentas();
    }
  } catch (_) {}

  // Cargar CSV principal
  try {
    const r = await fetch(BASE_URL + CSV_FILE);
    if (!r.ok) throw new Error(`No se pudo cargar ${CSV_FILE} (HTTP ${r.status})`);
    const txt = await r.text();
    allRows = parseCSV(txt);
    filteredRows = [...allRows];
    currentPage = 1;
    renderTable();
    renderPagination();
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="12" style="color:red;padding:20px;">${err.message}</td></tr>`;
  }
}

// ─── PARSE CSV ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  const headers = lines[0].split(";").map(h => h.trim());
  const data = [];
  for (let i = 1; i < lines.length; i++) {
    const values = lines[i].split(";");
    const obj = {};
    headers.forEach((h, idx) => obj[h] = values[idx] ? values[idx].trim() : "");
    obj._id = obj["Nro"] + "-" + obj["Folio"];
    data.push(obj);
  }
  return data;
}

// ─── DESCIFRADO AES-256-CBC + PBKDF2 ─────────────────────────────────────────
async function decryptTxt(arrayBuffer, pwd) {
  const rawText = new TextDecoder('utf-8').decode(arrayBuffer);
  const b64 = rawText.replace(/^\uFEFF/, '').replace(/[^A-Za-z0-9+/=]/g, '');
  const raw = b64ToBytes(b64);

  console.log('b64 length:', b64.length);
  console.log('raw bytes:', raw.length);
  console.log('pwd:', pwd);

  if (raw.length < 48) throw new Error(`Archivo demasiado corto (${raw.length} bytes)`);

  const salt       = raw.slice(0, 16);
  const iv         = raw.slice(16, 32);
  const ciphertext = raw.slice(32);

  console.log('salt b64:', btoa(String.fromCharCode(...salt)));
  console.log('iv b64:', btoa(String.fromCharCode(...iv)));

  const pwdKey = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']
  );

  let decrypted = null;
  for (const hash of ['SHA-1', 'SHA-256']) {
    try {
      const key = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash },
        pwdKey,
        { name: 'AES-CBC', length: 256 }, false, ['decrypt']
      );
      decrypted = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, key, ciphertext);
      console.log('Descifrado OK con hash:', hash);
      break;
    } catch (e) {
      console.log('Falló con hash', hash, ':', e.message);
    }
  }

  if (!decrypted) throw new Error('Contraseña incorrecta o archivo dañado');

  const bytes  = new Uint8Array(decrypted);
  const padLen = bytes[bytes.length - 1];
  if (padLen < 1 || padLen > 16) throw new Error('Padding inválido');
  return new TextDecoder('utf-8').decode(bytes.slice(0, bytes.length - padLen));
}
  if (!decrypted) throw new Error('Contraseña incorrecta o archivo dañado');

  const bytes  = new Uint8Array(decrypted);
  const padLen = bytes[bytes.length - 1];
  if (padLen < 1 || padLen > 16) throw new Error('Padding inválido');
  return new TextDecoder('utf-8').decode(bytes.slice(0, bytes.length - padLen));
}

function b64ToBytes(b64) {
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return arr;
}

// ─── ABRIR FACTURA EN IFRAME ──────────────────────────────────────────────────
async function loadFacturaEnIframe(clave) {
  const frameStatus = document.getElementById('frameStatus');
  const docFrame    = document.getElementById('docFrame');

  // Revocar blob anterior
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  docFrame.src = '';

  if (!clave) {
    frameStatus.style.display = 'block';
    frameStatus.textContent = 'Sin documento adjunto.';
    return;
  }

  if (!userPassword) {
    frameStatus.style.display = 'block';
    frameStatus.style.color = 'orange';
    frameStatus.textContent = '⚠ Ingresa la contraseña para ver el documento.';
    return;
  }

  frameStatus.style.display = 'block';
  frameStatus.style.color = '#666';
  frameStatus.textContent = '⏳ Descargando y descifrando…';
  docFrame.src = '';

  try {
    const txtUrl  = BASE_URL + clave + '.txt';
    const resp    = await fetch(txtUrl, { cache: 'no-store' });
    if (!resp.ok) throw new Error(`No se encontró el archivo (HTTP ${resp.status})`);
    const buf     = await resp.arrayBuffer();
    const html    = await decryptTxt(buf, userPassword);
    const blob    = new Blob([html], { type: 'text/html' });
    currentBlobUrl = URL.createObjectURL(blob);
    frameStatus.style.display = 'none';
    docFrame.src = currentBlobUrl;
  } catch (err) {
    frameStatus.style.display = 'block';
    frameStatus.style.color   = 'red';
    frameStatus.textContent   = '✗ ' + err.message;
  }
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function openAccountModal(id) {
  currentId = id;
  const r = allRows.find(x => x._id === id);
  document.getElementById("mProveedor").innerText = r.RazonSocial;
  document.getElementById("mRut").innerText       = r.RUTProveedor;
  document.getElementById("mFolio").innerText     = r.Folio;
  document.getElementById("mFecha").innerText     = r.FechaDocto;
  document.getElementById("mGlosa").value         = "Compra factura " + r.Folio + " " + r.RazonSocial;

  const neto  = Number(r.MontoNeto  || 0);
  const iva   = Number(r.MontoIVA   || 0);
  const total = Number(r.MontoTotal || 0);

  document.getElementById("asientoBody").innerHTML = "";
  addRow("6101 Compras",      neto,  "");
  addRow("1190 IVA Crédito",  iva,   "");
  addRow("2101 Proveedores",  "",    total);

  document.getElementById("accountModal").style.display = "block";

  // Cargar factura cifrada
  const clave = String(r["ClavePDF"] || "").trim();
  loadFacturaEnIframe(clave);
}

function closeModal() {
  document.getElementById("accountModal").style.display = "none";
  if (currentBlobUrl) { URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
  document.getElementById('docFrame').src = '';
}

function saveAccount() {
  const row = allRows.find(r => r._id === currentId);
  row.Glosa = document.getElementById("mGlosa").value;
  document.querySelectorAll("#asientoBody tr").forEach((tr, i) => {
    row[`Cuenta${i+1}`] = tr.querySelector(".cuenta").value;
    row[`Debe${i+1}`]   = tr.querySelector(".debe").value   || 0;
    row[`Haber${i+1}`]  = tr.querySelector(".haber").value  || 0;
  });
  accountMap[currentId] = "Asiento creado";
  renderTable();
  closeModal();
}

// ─── FILAS DE ASIENTO ─────────────────────────────────────────────────────────
function addRow(cuenta = "", debe = "", haber = "") {
  const tr = document.createElement("tr");
  tr.innerHTML = `
    <td><input list="cuentasDatalist" type="text" class="cuenta" value="${cuenta}" placeholder="Cuenta contable"></td>
    <td><input type="text" class="debe"  value="${debe  ? money(debe)  : ''}" oninput="soloDebe(this);formatNumber(this);updateTotals()" onkeydown="if(event.key==='Enter'){addRow();}"></td>
    <td><input type="text" class="haber" value="${haber ? money(haber) : ''}" oninput="soloHaber(this);formatNumber(this);updateTotals()" onkeydown="if(event.key==='Enter'){addRow();}"></td>
    <td><button onclick="this.closest('tr').remove();updateTotals()">X</button></td>
  `;
  document.getElementById("asientoBody").appendChild(tr);
  updateTotals();
}

function updateTotals() {
  let d = 0, h = 0;
  document.querySelectorAll(".debe").forEach(i  => { d += Number(i.value.replace(/\./g,'') || 0); });
  document.querySelectorAll(".haber").forEach(i => { h += Number(i.value.replace(/\./g,'') || 0); });
  document.getElementById("totalDebe").innerText  = money(d);
  document.getElementById("totalHaber").innerText = money(h);
}

function soloDebe(input)  { if (input.value.trim()) input.closest("tr").querySelector(".haber").value = ""; }
function soloHaber(input) { if (input.value.trim()) input.closest("tr").querySelector(".debe").value  = ""; }

function actualizarDatalistCuentas() {
  document.getElementById("cuentasDatalist").innerHTML =
    planCuentas.map(c => `<option value="${c}">`).join("\n");
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function money(v) { return Number(v || 0).toLocaleString("es-CL"); }

function toggleProcess(id) { statusMap[id] = !statusMap[id]; renderTable(); }

function renderTable() {
  tbody.innerHTML = "";
  const start = (currentPage - 1) * PAGE_SIZE;
  const rows  = filteredRows.slice(start, start + PAGE_SIZE);
  rows.forEach(r => {
    const tr = document.createElement("tr");
    if (statusMap[r._id]) tr.classList.add("processed-row");
    // Determinar si tiene txt cifrado (ClavePDF presente)
    const clave     = String(r["ClavePDF"] || "").trim();
    const tieneHtml = !!clave;
    tr.innerHTML = `
      <td style="text-align:center">
        <input type="checkbox" ${statusMap[r._id] ? "checked" : ""} onclick="toggleProcess('${r._id}')">
      </td>
      <td>${r["Nro"]          || ""}</td>
      <td>${r["TipoDoc"]      || ""}</td>
      <td>${r["RUTProveedor"] || ""}</td>
      <td title="${r["RazonSocial"] || ""}">${r["RazonSocial"] || ""}</td>
      <td>${r["Folio"]        || ""}</td>
      <td>${r["FechaDocto"]   || ""}</td>
      <td class="money">${money(r["MontoExento"])}</td>
      <td class="money">${money(r["MontoNeto"])}</td>
      <td class="money">${money(r["MontoIVA"])}</td>
      <td class="money">${money(r["MontoTotal"])}</td>
      <td>
        <button onclick="openAccountModal('${r._id}')">
          ${accountMap[r._id] ? "Editar asiento" : "Crear asiento"}
        </button>
        ${tieneHtml ? '<span style="color:green;font-size:11px;margin-left:4px;">●</span>' : ''}
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function renderPagination() {
  const total = Math.ceil(filteredRows.length / PAGE_SIZE) || 1;
  paginacion.innerHTML = "";
  const prev = document.createElement("button");
  prev.textContent = "◀ Anterior"; prev.disabled = currentPage === 1;
  prev.onclick = () => { currentPage--; renderTable(); renderPagination(); };
  const next = document.createElement("button");
  next.textContent = "Siguiente ▶"; next.disabled = currentPage === total;
  next.onclick = () => { currentPage++; renderTable(); renderPagination(); };
  const info = document.createElement("span");
  info.textContent = ` Página ${currentPage} de ${total} `;
  paginacion.append(prev, info, next);
}

// ─── FILTROS ──────────────────────────────────────────────────────────────────
function applyFilters() {
  const tipo   = document.getElementById('fTipo').value.toLowerCase();
  const rut    = document.getElementById('fRut').value.toLowerCase();
  const razon  = document.getElementById('fRazon').value.toLowerCase();
  const folio  = document.getElementById('fFolio').value.toLowerCase();
  const fecha  = document.getElementById('fFecha').value;
  const html   = document.getElementById('fPdf').value;

  filteredRows = allRows.filter(r => {
    let fd = r["FechaDocto"] || "";
    if (fd.includes("-")) { const [d,m,y] = fd.split("-"); fd = `${y}-${m}-${d}`; }
    const clave     = String(r["ClavePDF"] || "").trim();
    const tieneHtml = !!clave;
    if (tipo  && !(r["TipoDoc"]      || "").toLowerCase().includes(tipo))  return false;
    if (rut   && !(r["RUTProveedor"] || "").toLowerCase().includes(rut))   return false;
    if (razon && !(r["RazonSocial"]  || "").toLowerCase().includes(razon)) return false;
    if (folio && !(r["Folio"]        || "").toLowerCase().includes(folio)) return false;
    if (fecha && fd !== fecha) return false;
    if (html === "con" && !tieneHtml) return false;
    if (html === "sin" &&  tieneHtml) return false;
    return true;
  });
  currentPage = 1;
  renderTable();
  renderPagination();
}

function resetFilters() {
  document.querySelectorAll(".filters input, .filters select").forEach(el => el.value = "");
  filteredRows = [...allRows];
  currentPage = 1;
  renderTable();
  renderPagination();
}

document.querySelectorAll(".filters input, .filters select")
  .forEach(el => el.addEventListener("input", applyFilters));

// ─── DESCARGAR CSV ────────────────────────────────────────────────────────────
function downloadCSV() {
  if (!allRows.length) return;
  const headersSet = new Set();
  allRows.forEach(r => Object.keys(r).forEach(h => headersSet.add(h)));
  const headers = Array.from(headersSet);
  const csv = [headers.join(";"), ...allRows.map(r => headers.map(h => r[h] ?? "").join(";"))].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href = url; a.download = "documentos_actualizados.csv"; a.click();
  URL.revokeObjectURL(url);
}

// ─── FORMATO NÚMERO ───────────────────────────────────────────────────────────
function formatNumber(input) {
  let v = input.value.replace(/\./g, '').replace(/[^\d]/g, '');
  input.value = v === "" ? "" : Number(v).toLocaleString("es-CL");
}

// ─── ARRANCAR ─────────────────────────────────────────────────────────────────
init();
</script>
</body>
</html>
