<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Descifrador de Facturas Debug</title>
<style>
  body { font-family: monospace; padding: 20px; background: #f9f9f9; }
  input, button { padding: 8px; margin: 5px 0; width: 100%; max-width: 600px; }
  pre { background: #eee; padding: 10px; max-width: 600px; overflow-x: auto; }
</style>
</head>
<body>
<h2>Descifrador de Facturas con Debug</h2>

<label>URL del TXT cifrado en GitHub:</label>
<input type="text" id="txtUrl" placeholder="https://.../factura.txt" />

<label>Contraseña:</label>
<input type="password" id="password" placeholder="Contraseña de cifrado" />

<button onclick="descifrar()">Descifrar y mostrar</button>

<h3>Logs:</h3>
<pre id="logs"></pre>

<iframe id="visor" style="width:100%; height:70vh; border:1px solid #ccc; margin-top:10px;"></iframe>

<script>
function log(msg) {
  const pre = document.getElementById("logs");
  pre.textContent += msg + "\n";
}

function quitarPaddingPKCS7(data) {
    const padLen = data[data.length - 1];
    if(padLen < 1 || padLen > 16) {
      log("Padding inválido: " + padLen);
      return data;
    }
    for(let i = data.length - padLen; i < data.length; i++) {
        if(data[i] !== padLen) {
          log("Padding inválido detectado en byte " + i);
          return data;
        }
    }
    log("Padding válido detectado, longitud: " + padLen);
    return data.slice(0, data.length - padLen);
}

async function descifrar() {
    const url = document.getElementById("txtUrl").value.trim();
    const password = document.getElementById("password").value;
    const logs = document.getElementById("logs");
    logs.textContent = "";

    if (!url || !password) {
        alert("Ingresa la URL del TXT y la contraseña.");
        return;
    }

    try {
        log("Fetch de archivo: " + url);
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("No se pudo leer el archivo.");
        const base64 = await resp.text();

        log("Base64 length: " + base64.length);
        const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
        log("Bytes total: " + data.length);

        const salt = data.slice(0,16);
        const iv = data.slice(16,32);
        const ciphertext = data.slice(32);

        log("Salt: " + Array.from(salt).map(b => b.toString(16).padStart(2,"0")).join(" "));
        log("IV: " + Array.from(iv).map(b => b.toString(16).padStart(2,"0")).join(" "));
        log("Ciphertext length: " + ciphertext.length);

        const keyMaterial = await window.crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );
        log("Clave importada");

        const key = await window.crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-CBC", length: 256 },
            false,
            ["decrypt"]
        );
        log("Clave derivada");

        const decryptedBuffer = await window.crypto.subtle.decrypt(
            {name: "AES-CBC", iv: iv},
            key,
            ciphertext
        );
        log("Archivo descifrado, tamaño buffer: " + decryptedBuffer.byteLength);

        const decryptedBytes = new Uint8Array(decryptedBuffer);
        const dataNoPad = quitarPaddingPKCS7(decryptedBytes);

        const decoder = new TextDecoder();
        const html = decoder.decode(dataNoPad);
        log("Texto descifrado listo");

        document.getElementById("visor").srcdoc = html;

    } catch (e) {
        log("Error: " + e.message);
        alert("Error al descifrar: " + e.message);
        console.error(e);
    }
}
</script>

</body>
</html>
