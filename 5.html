<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desencriptador AES-256 2</title>
    <!-- Enlace principal de CryptoJS (Todo en uno) -->
    <script src="https://cdnjs.cloudflare.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background: #f0f2f5; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a73e8; margin-top: 0; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; transition: background 0.3s; }
        button:hover { background: #1557b0; }
        #viewer { border: 1px dashed #ccc; padding: 15px; margin-top: 20px; background: #fafafa; min-height: 100px; overflow-x: auto; }
        .error-msg { color: #d93025; font-weight: bold; display: none; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔓 Desencriptar Archivos HTML</h2>
        <div id="libError" class="error-msg">⚠️ ERROR: No se pudo cargar CryptoJS. Verifica tu conexión a internet.</div>
        
        <label>Contraseña:</label>
        <input type="password" id="pass" placeholder="Ingresa la contraseña" value="c12982613">
        
        <label>Contenido del archivo .txt (Base64):</label>
        <textarea id="base64Input" placeholder="Pega aquí el texto que generó el script de Python..."></textarea>
        
        <button onclick="decrypt()">Desencriptar y Visualizar</button>
        
        <h3>Contenido Original:</h3>
        <div id="viewer">Aquí aparecerá tu HTML una vez desencriptado.</div>
    </div>

    <script>
        // Verificación inicial de la librería
        window.onload = function() {
            if (typeof CryptoJS === 'undefined') {
                document.getElementById('libError').style.display = 'block';
            }
        };

        function decrypt() {
            const password = document.getElementById('pass').value;
            const encryptedData = document.getElementById('base64Input').value.trim();
            const viewer = document.getElementById('viewer');

            if (!encryptedData) {
                alert("Por favor, pega el contenido del archivo .txt");
                return;
            }

            try {
                // 1. Decodificar el Base64 global (salt + iv + ciphertext)
                const rawData = CryptoJS.enc.Base64.parse(encryptedData);
                
                // 2. Extraer partes (Pycryptodome: Salt 16 bytes, IV 16 bytes)
                // En CryptoJS, cada 'word' son 4 bytes. 16 bytes = 4 words.
                const salt = CryptoJS.lib.WordArray.create(rawData.words.slice(0, 4));
                const iv = CryptoJS.lib.WordArray.create(rawData.words.slice(4, 8));
                const ciphertext = CryptoJS.lib.WordArray.create(rawData.words.slice(8));

                // 3. Derivar Clave PBKDF2 (Igual a tu script de Python)
                // Python: count=100000, dkLen=32. CryptoJS: keySize=8 (8 words * 4 bytes = 32 bytes)
                const key = CryptoJS.PBKDF2(password, salt, {
                    keySize: 256 / 32,
                    iterations: 100000,
                    hasher: CryptoJS.algo.SHA1 // Standard de Pycryptodome para PBKDF2
                });

                // 4. Desencriptar AES-CBC
                const decrypted = CryptoJS.AES.decrypt(
                    { ciphertext: ciphertext },
                    key,
                    { 
                        iv: iv, 
                        mode: CryptoJS.mode.CBC, 
                        padding: CryptoJS.pad.Pkcs7 
                    }
                );

                // 5. Convertir a UTF-8
                const htmlResult = decrypted.toString(CryptoJS.enc.Utf8);
                
                if (!htmlResult) throw new Error("Datos inválidos o contraseña incorrecta.");
                
                // Renderizar como HTML real
                viewer.innerHTML = htmlResult;
                
            } catch (e) {
                console.error(e);
                alert("Error al desencriptar: " + e.message);
                viewer.innerText = "Error: Verifica la contraseña o el formato del texto.";
            }
        }
    </script>
</body>
</html>
