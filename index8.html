<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Listado de Documentos</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>

</head>

<body>

<div class="container">

<h2>Listado de Documentos Tributarios</h2>

<div class="upload">
<input type="file" id="folder" webkitdirectory multiple>
</div>

<div class="filters">

<input type="text" id="fTipo" placeholder="TipoDoc">
<input type="text" id="fRut" placeholder="RUT">
<input type="text" id="fRazon" placeholder="Razón Social">
<input type="text" id="fFolio" placeholder="Folio">

<label>Fecha:</label>
<input type="date" id="fFecha">

<select id="fPdf">
<option value="">HTML: Todos</option>
<option value="con">Con HTML</option>
<option value="sin">Sin HTML</option>
</select>

<button onclick="applyFilters()">Aplicar</button>
<button onclick="resetFilters()">Limpiar</button>

</div>

<table>

<thead>

<tr>
<th>Ok</th>
<th>Nro</th>
<th>Td</th>
<th>RUT</th>
<th>RazonSocial</th>
<th>Folio</th>
<th>Fecha</th>
<th class="money"><b>Exento</b></th>
<th class="money"><b>Neto</b></th>
<th class="money"><b>IVA</b></th>
<th class="money"><b>Total</b></th>
<th>Cuenta Contable</th>
</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

<div id="paginacion" style="margin-top:15px;text-align:center;"></div>

</div>

<!-- MODAL ERP -->

<div id="accountModal" class="modal">

<div class="modal-content">

<div class="modal-grid">

<div class="asiento-panel">

<div><b>ASIENTO CONTABLE</b></div>
<div><b>Proveedor:</b> <span id="mProveedor"></span></div>
<div><b>RUT:</b> <span id="mRut"></span></div>
<div><b>Folio:</b> <span id="mFolio"></span></div>
<div><b>Fecha:</b> <span id="mFecha"></span></div>

<br>

<label>Glosa</label>
<input type="text" id="mGlosa" style="width:100%">

<br><br>

<table class="asiento">
<thead>
<tr>
<th>Cuenta</th>
<th>Debe</th>
<th>Haber</th>
<th></th>
</tr>
</thead>
<tbody id="asientoBody"></tbody>
</table>

<br>

<button onclick="addRow()">+ Agregar Cuenta</button>

<br><br>

<div style="text-align:right">
<b>Total Debe:</b> <span id="totalDebe"></span><br>
<b>Total Haber:</b> <span id="totalHaber"></span>
</div>

<br>

<button onclick="saveAccount()">Guardar</button>
<button onclick="closeModal()">Cerrar</button>
<button onclick="downloadCSV()">Descargar CSV</button>

</div>

<div class="resizer"></div>

<div class="factura">
<iframe id="docFrame"></iframe>
</div>

</div>

<!-- Datalist para buscador de cuentas -->
<datalist id="cuentasDatalist"></datalist>

<script>

const folderInput = document.getElementById("folder");
const tbody = document.getElementById("tbody");
const paginacion = document.getElementById("paginacion");
const PAGE_SIZE = 10;

let allRows = [];
let filteredRows = [];
let htmlMap = {};
let planCuentas = [];
let currentPage = 1;
let statusMap = {};
let accountMap = {};
let currentId = null;

// Escuchar carpeta
folderInput.addEventListener("change", function(e){
    const files = Array.from(e.target.files);

    // CSV de facturas
    const csvFile = files.find(f => /^Tmp\.csv$/i.test(f.name));
    if(!csvFile){ alert("No se encontró Tmp.csv"); return; }

    // CSV de plan de cuentas
    const planFile = files.find(f => /^plan_cuentas\.csv$/i.test(f.name));
    if(planFile){
        const readerPlan = new FileReader();
        readerPlan.onload = ev => {
            const lines = ev.target.result.split(/\r?\n/).filter(l => l.trim() !== "");
            planCuentas = lines.map(l => l.split(";")[0].trim());
            actualizarDatalistCuentas();
        };
        readerPlan.readAsText(planFile, "utf-8");
    }

    // Mapear HTML
    htmlMap = {};
    files.filter(f => /\.html$/i.test(f.name)).forEach(f=>{
        const base = f.name.replace(/^.*[\\/]/, '').replace(/\.html$/i,"").trim();
        htmlMap[base] = URL.createObjectURL(f);
    });

    // Leer CSV facturas
    const reader = new FileReader();
    reader.onload = ev => {
        allRows = parseCSV(ev.target.result);
        filteredRows = [...allRows];
        currentPage = 1;
        renderTable();
        renderPagination();
    };
    reader.readAsText(csvFile,"utf-8");
});

// Parse CSV
function parseCSV(text){
    const lines = text.split(/\r?\n/).filter(l => l.trim() !== "");
    const headers = lines[0].split(";").map(h => h.trim());
    const data = [];
    for (let i=1;i<lines.length;i++){
        const values = lines[i].split(";");
        const obj = {};
        headers.forEach((h, idx) => obj[h] = values[idx]?values[idx].trim():"");
        obj._id = obj["Nro"]+"-"+obj["Folio"];
        data.push(obj);
    }
    return data;
}

// Formato dinero
function money(v){ return Number(v||0).toLocaleString("es-CL"); }

// Totales y tabla
function toggleProcess(id){ statusMap[id] = !statusMap[id]; renderTable(); }

function addRow(cuenta="", debe="", haber=""){
    const tr = document.createElement("tr");
    tr.innerHTML = `
        <td><input list="cuentasDatalist" type="text" class="cuenta" value="${cuenta}" placeholder="Cuenta contable"></td>
        <td><input type="text" class="debe" value="${debe?money(debe):''}" oninput="soloDebe(this);formatNumber(this);updateTotals()" onkeydown="if(event.key==='Enter'){addRow();}"></td>
        <td><input type="text" class="haber" value="${haber?money(haber):''}" oninput="soloHaber(this);formatNumber(this);updateTotals()" onkeydown="if(event.key==='Enter'){addRow();}"></td>
        <td><button onclick="this.closest('tr').remove();updateTotals()">X</button></td>
    `;
    document.getElementById("asientoBody").appendChild(tr);
    updateTotals();
}

function updateTotals(){
    let totalDebe = 0, totalHaber = 0;
    document.querySelectorAll(".debe").forEach(i=>{ let v=i.value.replace(/\./g,''); totalDebe+=Number(v||0); });
    document.querySelectorAll(".haber").forEach(i=>{ let v=i.value.replace(/\./g,''); totalHaber+=Number(v||0); });
    document.getElementById("totalDebe").innerText = money(totalDebe);
    document.getElementById("totalHaber").innerText = money(totalHaber);
}

// Debe/Haber exclusivos
function soloDebe(input){ if(input.value.trim()!==""){ input.closest("tr").querySelector(".haber").value=""; } }
function soloHaber(input){ if(input.value.trim()!==""){ input.closest("tr").querySelector(".debe").value=""; } }

// Datalist cuentas
function actualizarDatalistCuentas(){
    const dl = document.getElementById("cuentasDatalist");
    dl.innerHTML = planCuentas.map(c=>`<option value="${c}">`).join("\n");
}

// Modal asiento
function openAccountModal(id){
    currentId = id;
    const r = allRows.find(x=>x._id===id);
    document.getElementById("mProveedor").innerText = r.RazonSocial;
    document.getElementById("mRut").innerText = r.RUTProveedor;
    document.getElementById("mFolio").innerText = r.Folio;
    document.getElementById("mFecha").innerText = r.FechaDocto;
    document.getElementById("mGlosa").value = "Compra factura "+r.Folio+" "+r.RazonSocial;

    const neto = Number(r.MontoNeto||0);
    const iva = Number(r.MontoIVA||0);
    const total = Number(r.MontoTotal||0);

    const body = document.getElementById("asientoBody");
    body.innerHTML = "";
    addRow("6101 Compras", neto, "");
    addRow("1190 IVA Crédito", iva, "");
    addRow("2101 Proveedores", "", total);

    const clave = String(r["ClavePDF"]||"").trim();
    if(htmlMap[clave]) document.getElementById("docFrame").src = htmlMap[clave];

    document.getElementById("accountModal").style.display = "block";
}

function closeModal(){ document.getElementById("accountModal").style.display = "none"; }

function saveAccount(){
    const row = allRows.find(r=>r._id===currentId);
    row.Glosa = document.getElementById("mGlosa").value;
    const rows = document.querySelectorAll("#asientoBody tr");
    rows.forEach((tr, index)=>{
        const cuenta = tr.querySelector(".cuenta").value;
        const debe = tr.querySelector(".debe").value || 0;
        const haber = tr.querySelector(".haber").value || 0;
        row[`Cuenta${index+1}`] = cuenta;
        row[`Debe${index+1}`] = debe;
        row[`Haber${index+1}`] = haber;
    });
    accountMap[currentId] = "Asiento creado";
    renderTable();
    closeModal();
}

function downloadCSV(){
    if(!allRows.length) return;
    const headersSet = new Set();
    allRows.forEach(r=>Object.keys(r).forEach(h=>headersSet.add(h)));
    const headers = Array.from(headersSet);
    const csv = [headers.join(";"), ...allRows.map(r=>headers.map(h=>r[h]??"").join(";"))].join("\n");
    const blob = new Blob([csv],{type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="documentos_actualizados.csv";
    a.click();
    URL.revokeObjectURL(url);
}

// Render tabla y paginación
function renderTable(){
    tbody.innerHTML = "";
    const start=(currentPage-1)*PAGE_SIZE;
    const rows=filteredRows.slice(start,start+PAGE_SIZE);
rows.forEach(r => {
    const tr = document.createElement("tr");

    // Si la fila está marcada como procesada
    if(statusMap[r._id]) tr.classList.add("processed-row");

    // Agregar clase para indicar que está filtrada
    if(filteredRows.length !== allRows.length) tr.classList.add("filtered-row");

    tr.innerHTML = `
        <td style="text-align:center">
            <input type="checkbox" ${statusMap[r._id] ? "checked" : ""} onclick="toggleProcess('${r._id}')">
        </td>
        <td>${r["Nro"] || ""}</td>
        <td>${r["TipoDoc"] || ""}</td>
        <td>${r["RUTProveedor"] || ""}</td>
        <td title="${r["RazonSocial"] || ""}">${r["RazonSocial"] || ""}</td>
        <td>${r["Folio"] || ""}</td>
        <td>${r["FechaDocto"] || ""}</td>
        <td class="money">${money(r["MontoExento"])}</td>
        <td class="money">${money(r["MontoNeto"])}</td>
        <td class="money">${money(r["MontoIVA"])}</td>
        <td class="money">${money(r["MontoTotal"])}</td>
        <td>
            <button onclick="openAccountModal('${r._id}')">
                ${accountMap[r._id] ? "Editar asiento" : "Crear asiento"}
            </button>
        </td>
    `;
    tbody.appendChild(tr);
});
}

function renderPagination(){
    const totalPages = Math.ceil(filteredRows.length/PAGE_SIZE)||1;
    paginacion.innerHTML="";
    const prev=document.createElement("button"); prev.textContent="◀ Anterior"; prev.disabled=currentPage===1;
    prev.onclick=()=>{ currentPage--; renderTable(); renderPagination(); };
    const next=document.createElement("button"); next.textContent="Siguiente ▶"; next.disabled=currentPage===totalPages;
    next.onclick=()=>{ currentPage++; renderTable(); renderPagination(); };
    const info=document.createElement("span"); info.textContent=` Página ${currentPage} de ${totalPages} `;
    paginacion.append(prev, info, next);
}

function applyFilters(){
    const tipo=fTipo.value.toLowerCase();
    const rut=fRut.value.toLowerCase();
    const razon=fRazon.value.toLowerCase();
    const folio=fFolio.value.toLowerCase();
    const fechaFiltro=fFecha.value;
    const html=fPdf.value;

    filteredRows = allRows.filter(r=>{
        let fecha=r["FechaDocto"]||"";
        if(fecha.includes("-")){
            const [d,m,y]=fecha.split("-");
            fecha=`${y}-${m}-${d}`;
        }
        const clave = String(r["ClavePDF"]||"").trim();
        const tieneHtml = !!htmlMap[clave];

        if(tipo && !(r["TipoDoc"]||"").toLowerCase().includes(tipo)) return false;
        if(rut && !(r["RUTProveedor"]||"").toLowerCase().includes(rut)) return false;
        if(razon && !(r["RazonSocial"]||"").toLowerCase().includes(razon)) return false;
        if(folio && !(r["Folio"]||"").toLowerCase().includes(folio)) return false;
        if(fechaFiltro && fecha!==fechaFiltro) return false;
        if(html==="con" && !tieneHtml) return false;
        if(html==="sin" && tieneHtml) return false;
        return true;
    });

    currentPage=1;
    renderTable();
    renderPagination();
}

function resetFilters(){
    document.querySelectorAll(".filters input, .filters select").forEach(el=>el.value="");
    filteredRows=[...allRows];
    currentPage=1;
    renderTable();
    renderPagination();
}

// Formato número en inputs
function formatNumber(input){
    let value=input.value.replace(/\./g,'').replace(/[^\d]/g,'');
    if(value===""){ input.value=""; return; }
    input.value=Number(value).toLocaleString("es-CL");
}

document.querySelectorAll(".filters input, .filters select").forEach(el=>el.addEventListener("input", applyFilters));

</script>

</body>
</html>
