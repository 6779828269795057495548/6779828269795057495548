<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Descifrador AES-GCM</title>
<style>
  body { font-family: sans-serif; padding: 20px; background: #f0f0f0; }
  input, button { padding: 8px; margin: 5px 0; width: 100%; }
  iframe { width: 100%; height: 80vh; border: 1px solid #ccc; margin-top: 10px; }
</style>
</head>
<body>
<h2>Descifrador de Facturas AES-GCM</h2>

<label>URL del TXT cifrado en GitHub:</label>
<input type="text" id="txtUrl" placeholder="https://.../factura.txt">

<label>Contraseña:</label>
<input type="password" id="password" placeholder="Contraseña de cifrado">

<button onclick="descifrar()">Descifrar y mostrar</button>

<iframe id="visor"></iframe>

<script>
async function descifrar() {
    const url = document.getElementById("txtUrl").value.trim();
    const password = document.getElementById("password").value;

    if (!url || !password) {
        alert("Ingresa la URL del TXT y la contraseña.");
        return;
    }

    try {
        // Leer TXT desde GitHub
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("No se pudo leer el archivo.");
        const base64 = await resp.text();

        const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));

        // Separar componentes: salt(16) + nonce(16) + ciphertext + tag(16)
        const salt = data.slice(0,16);
        const nonce = data.slice(16,32);
        const tag = data.slice(data.length - 16);
        const ciphertext = data.slice(32, data.length - 16);

        // Derivar clave con PBKDF2
        const keyMaterial = await window.crypto.subtle.importKey(
            "raw",
            new TextEncoder().encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

        const key = await window.crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: salt,
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["decrypt"]
        );

        // Concatenar ciphertext + tag
        const ctWithTag = new Uint8Array(ciphertext.length + tag.length);
        ctWithTag.set(ciphertext);
        ctWithTag.set(tag, ciphertext.length);

        // Descifrar
        const decryptedBuffer = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: nonce },
            key,
            ctWithTag
        );

        const decoder = new TextDecoder();
        const html = decoder.decode(decryptedBuffer);

        // Mostrar en iframe
        document.getElementById("visor").srcdoc = html;

    } catch (e) {
        alert("Error al descifrar: " + e.message);
        console.error(e);
    }
}
</script>
</body>
</html>
