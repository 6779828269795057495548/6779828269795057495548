<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documento Protegido</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Arial,sans-serif;background:#1e2a38;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .card{background:#fff;padding:36px 40px;border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.35);width:100%;max-width:380px;text-align:center}
  .lock{font-size:48px;margin-bottom:12px}
  h2{color:#1f2937;font-size:20px;margin-bottom:6px}
  p{color:#6b7280;font-size:13px;margin-bottom:20px}
  input{width:100%;padding:11px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:10px;outline:none;transition:border .2s}
  input:focus{border-color:#4f46e5}
  button{width:100%;padding:12px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;transition:background .2s}
  button:hover{background:#4338ca}
  button:disabled{background:#9ca3af;cursor:not-allowed}
  .error{color:#dc2626;font-size:12px;margin-bottom:10px;display:none}
  .spinner{display:none;margin:8px auto 0;width:22px;height:22px;border:3px solid #e5e7eb;border-top-color:#4f46e5;border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="lock">🔒</div>
  <h2>Documento Protegido</h2>
  <p>Ingresa la contraseña para acceder al contenido</p>
  <div class="error" id="err">Contraseña incorrecta</div>
  <input type="password" id="pwd" placeholder="Contraseña" autofocus
         onkeydown="if(event.key==='Enter')descifrar()">
  <button onclick="descifrar()" id="btn">Abrir</button>
  <div class="spinner" id="spin"></div>
</div>

<script>
async function descifrar() {
  const pwd = document.getElementById("pwd").value;
  if (!pwd) return;
  const btn  = document.getElementById("btn");
  const spin = document.getElementById("spin");
  const err  = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Descifrando...";
  spin.style.display = "block"; err.style.display = "none";
  try {
    const raw  = Uint8Array.from(atob(document.getElementById("payload").textContent.trim()), c => c.charCodeAt(0));
    const salt = raw.slice(0, 16);
    const iv   = raw.slice(16, 28);
    const data = raw.slice(28);
    const keyMat = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(pwd), "PBKDF2", false, ["deriveKey"]);
    const aesKey = await crypto.subtle.deriveKey(
      {name:"PBKDF2", salt, iterations:200000, hash:"SHA-256"},
      keyMat, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const decrypted = await crypto.subtle.decrypt({name:"AES-GCM", iv}, aesKey, data);
    const html = new TextDecoder().decode(decrypted);

    /* document.write mantiene el origen de GitHub Pages, por lo que
       style.css y demás recursos relativos se siguen resolviendo
       contra la URL base correcta. */
    document.open();
    document.write(html);
    document.close();

  } catch(e) {
    err.style.display = "block";
    btn.disabled = false; btn.textContent = "Abrir";
    spin.style.display = "none";
    document.getElementById("pwd").select();
  }
}
</script>
